services:
  - type: web
    name: david-li-homepage
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn david_home.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
