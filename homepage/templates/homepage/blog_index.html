{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ profile.name }} - blog">
  <title>Blog | {{ profile.name }}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'homepage/favicon-32.png' %}?v=20260530-balanced-hero">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'homepage/favicon-192.png' %}?v=20260530-balanced-hero">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'homepage/apple-touch-icon.png' %}?v=20260530-balanced-hero">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'homepage/concept.css' %}?v=20260605-blog-card-compact">
</head>
<body>
  <main class="blog-shell">
    <nav class="top-nav" aria-label="Research page navigation">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'publications' %}">Publications</a>
      <a href="{% url 'blog' %}" aria-current="page">Blog</a>
    </nav>

    <section class="blog-index" aria-labelledby="blog-index-title">
      <div class="section-title blog-index-title">
        <h1 id="blog-index-title">Blog</h1>
      </div>

      <div class="blog-post-list">
        <a class="blog-post-card" href="{% url 'idlm_blog' %}">
          <div class="blog-post-copy">
            <span class="blog-post-kicker">ICML 2026</span>
            <h2 aria-label="Few-step text generation with Inverse Distillation">
              <span aria-hidden="true">Few-step text generation</span>
              <span aria-hidden="true">with Inverse Distillation</span>
            </h2>
            <p>Inverse-distilled diffusion language models for fast parallel text generation.</p>
          </div>
          <div class="blog-post-thumb" aria-hidden="true">
            <img src="{% static 'homepage/blog/idlm-teaser.png' %}" alt="">
          </div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
